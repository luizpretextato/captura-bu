<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Captura de BU — apuração paralela</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js" onerror="window.__jsqrFail=1"></script>
<style>
  :root{
    --bg:#0E1116; --surface:#171B22; --surface2:#1E242E;
    --ink:#E7ECF3; --muted:#8A94A6; --line:#262C36;
    --ok:#3DD68C; --warn:#F2B84B; --bad:#F2685B; --accent:#5B8DEF;
    --shadow:0 8px 30px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--ink);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased; line-height:1.45;
    display:flex; flex-direction:column; min-height:100dvh;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  code,.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
  header{padding:14px 18px 6px}
  header h1{font-size:15px; font-weight:600; letter-spacing:.2px; margin:0}
  header p{font-size:12.5px; color:var(--muted); margin:2px 0 0}
  main{flex:1; display:flex; flex-direction:column; gap:14px; padding:8px 16px 20px; max-width:640px; width:100%; margin:0 auto}

  /* Viewport da câmera — o herói */
  .stage{position:relative; width:100%; aspect-ratio:1/1; border-radius:18px; overflow:hidden;
    background:#000; border:1px solid var(--line); box-shadow:var(--shadow)}
  video{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block}
  .frame{position:absolute; inset:0; pointer-events:none}
  .frame::before{content:""; position:absolute; inset:14%; border-radius:14px;
    box-shadow:0 0 0 2000px rgba(8,10,14,.34); }
  .bracket{position:absolute; width:34px; height:34px; border:3px solid rgba(255,255,255,.92)}
  .bracket.tl{top:14%; left:14%; border-right:0;border-bottom:0;border-radius:12px 0 0 0}
  .bracket.tr{top:14%; right:14%; border-left:0;border-bottom:0;border-radius:0 12px 0 0}
  .bracket.bl{bottom:14%; left:14%; border-right:0;border-top:0;border-radius:0 0 0 12px}
  .bracket.br{bottom:14%; right:14%; border-left:0;border-top:0;border-radius:0 0 12px 0}
  .stage.hit .bracket{border-color:var(--ok); transition:border-color .1s}
  .stage-idle{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; text-align:center; padding:24px; color:var(--muted)}
  .stage-idle svg{opacity:.7}
  .hint{position:absolute; left:0; right:0; bottom:12px; text-align:center; font-size:13px;
    color:#EAF0FA; text-shadow:0 1px 6px rgba(0,0,0,.7)}

  /* Progresso das partes */
  .parts{display:flex; gap:8px; align-items:center; justify-content:center; min-height:34px; flex-wrap:wrap}
  .chip{display:inline-flex; align-items:center; gap:7px; padding:6px 12px; border-radius:999px;
    background:var(--surface); border:1px solid var(--line); font-size:13px; color:var(--muted)}
  .chip.done{border-color:var(--ok); color:var(--ink)}
  .chip .dot{width:8px;height:8px;border-radius:50%;background:var(--line)}
  .chip.done .dot{background:var(--ok)}
  .status{font-size:13.5px; color:var(--muted); text-align:center; min-height:18px}

  /* Botões */
  .actions{display:flex; gap:10px}
  button{font:inherit; font-weight:600; border:0; border-radius:12px; padding:14px 16px; cursor:pointer;
    flex:1; color:var(--ink); background:var(--surface2); border:1px solid var(--line)}
  button.primary{background:var(--accent); border-color:var(--accent); color:#0A0E14}
  button:active{transform:translateY(1px)}
  button:disabled{opacity:.5}
  .filebtn{position:relative; overflow:hidden}
  .filebtn input{position:absolute; inset:0; opacity:0; cursor:pointer}

  /* Resultado */
  .result{background:var(--surface); border:1px solid var(--line); border-radius:16px; overflow:hidden}
  .r-head{padding:16px 18px; border-bottom:1px solid var(--line)}
  .r-head h2{margin:0; font-size:16px}
  .r-head .meta{margin-top:6px; font-size:13px; color:var(--muted); display:grid; grid-template-columns:1fr 1fr; gap:2px 14px}
  .cargo{padding:14px 18px; border-bottom:1px solid var(--line)}
  .cargo:last-child{border-bottom:0}
  .cargo h3{margin:0 0 2px; font-size:14px; display:flex; align-items:center; justify-content:space-between}
  .tipo{font-size:11px; font-weight:600; color:var(--muted); background:var(--surface2); padding:3px 9px; border-radius:999px}
  .row{display:flex; justify-content:space-between; font-size:13.5px; padding:3px 0}
  .row .n{color:var(--muted)}
  .row.b{font-weight:700}
  .rule{height:1px; background:var(--line); margin:8px 0}
  .badge{display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600; padding:5px 10px; border-radius:999px; margin-top:8px}
  .badge.ok{color:var(--ok); background:rgba(61,214,140,.12)}
  .badge.bad{color:var(--bad); background:rgba(242,104,91,.12)}
  .assi{padding:14px 18px}
  .assi .lbl{font-size:12px; color:var(--muted); margin-bottom:6px}
  .assi .val{font-family:'JetBrains Mono',monospace; font-size:11px; word-break:break-all; color:var(--ink); line-height:1.5}
  .note{font-size:12px; color:var(--muted); padding:0 2px}
  .warnbox{background:rgba(242,184,75,.1); border:1px solid rgba(242,184,75,.35); color:#F6D28A;
    border-radius:12px; padding:12px 14px; font-size:13px}
  .hidden{display:none!important}
  footer{padding:10px 18px 18px; text-align:center; font-size:11.5px; color:var(--muted)}
</style>
</head>
<body>
<header>
  <h1>Captura de Boletim de Urna</h1>
  <p>Apuração paralela · leitura ao vivo do QR — protótipo de teste</p>
</header>

<main>
  <div class="stage" id="stage">
    <video id="video" playsinline muted></video>
    <div class="frame">
      <span class="bracket tl"></span><span class="bracket tr"></span>
      <span class="bracket bl"></span><span class="bracket br"></span>
    </div>
    <div class="stage-idle" id="idle">
      <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
        <path d="M3 9V6a3 3 0 0 1 3-3h3M21 9V6a3 3 0 0 0-3-3h-3M3 15v3a3 3 0 0 0 3 3h3M21 15v3a3 3 0 0 1-3 3h-3"/>
        <rect x="8" y="8" width="8" height="8" rx="1"/>
      </svg>
      <div>Toque em <b>Iniciar câmera</b> e aponte para o QR do boletim.</div>
    </div>
    <div class="hint hidden" id="hint">Aponte para o QR — mantenha firme</div>
  </div>

  <div class="parts hidden" id="parts"></div>
  <div class="status" id="status"></div>

  <div class="actions" id="actions">
    <button class="primary" id="btnStart">Iniciar câmera</button>
    <button class="filebtn" id="btnFile">Enviar foto(s)
      <input type="file" accept="image/*" id="file" multiple>
    </button>
  </div>

  <div id="resultArea"></div>
</main>

<footer>Números de candidato e partido conforme o QR. Resultado não-oficial — apuração paralela.</footer>

<canvas id="canvas" class="hidden"></canvas>

<script>
/* ---------- Interpretação do BU (portado do parse_bu.py, já validado) ---------- */
const HEADER_KEYS=new Set(["ORIG","ORLC","PROC","DTPL","PLEI","TURN","FASE","UNFE","MUNI","ZONA","SECA","IDUE","IDCA","HIQT","HICA","VERS","LOCA","APTO","APTS","APTT","COMP","FALT","HBBM","HBBG","HBSB","HBMA","DTAB","HRAB","DTFC","HRFC","IDEL"]);
const TOTAIS=new Set(["APTA","APTS","APTT","NOMI","LEGC","BRAN","NULO","TOTC"]);
const CARGOS={"1":"Presidente","3":"Governador","5":"Senador","6":"Deputado Federal","7":"Deputado Estadual","8":"Deputado Distrital","11":"Prefeito","12":"Vice-Prefeito","13":"Vereador"};

function partInfo(t){const m=t.match(/^QRBU:(\d+):(\d+)/);return m?{n:+m[1],m:+m[2]}:null;}

function reassemble(map){
  const ns=[...map.keys()].sort((a,b)=>a-b);
  const total=partInfo(map.get(ns[0])).m;
  const missing=[];for(let i=1;i<=total;i++)if(!map.has(i))missing.push(i);
  let toks=[],assi=null;
  for(const n of ns){
    const ts=map.get(n).trim().split(/\s+/);
    for(const t of ts)if(t.startsWith("ASSI:"))assi=t.slice(5);
    toks=toks.concat(ts.filter(t=>!/^(QRBU|VRQR|VRCH|HASH|ASSI):/.test(t)));
  }
  return {toks,total,present:ns,missing,assi};
}

function parseToks(toks){
  const cab={},cargos=[];let cargo=null,part=null;
  for(const t of toks){
    const i=t.indexOf(":");if(i<0)continue;
    const ch=t.slice(0,i),val=t.slice(i+1);
    if(ch==="CARG"){cargo={CARG:val,tipo:null,partidos:[],flat:{},tot:{}};cargos.push(cargo);part=null;}
    else if(ch==="TIPO"&&cargo)cargo.tipo=val;
    else if(ch==="PART"&&cargo){part={PART:val,votos:{},LEGP:0,TOTP:0};cargo.partidos.push(part);}
    else if(ch==="LEGP"&&part)part.LEGP=+val;
    else if(ch==="TOTP"&&part)part.TOTP=+val;
    else if(TOTAIS.has(ch)&&cargo&&cargo.tipo!==null){cargo.tot[ch]=+val;part=null;}
    else if(/^\d+$/.test(ch)&&cargo){if(part)part.votos[ch]=+val;else cargo.flat[ch]=+val;}
    else if(HEADER_KEYS.has(ch)&&!cargo)cab[ch]=val;
  }
  return {cab,cargos};
}

/* ---------- Render ---------- */
function el(h){const d=document.createElement('div');d.innerHTML=h;return d.firstElementChild;}
function sum(o){return Object.values(o).reduce((a,b)=>a+b,0);}

function renderResult(map){
  const {toks,total,present,missing,assi}=reassemble(map);
  const area=document.getElementById('resultArea');
  if(missing.length){
    area.innerHTML='';
    area.appendChild(el(`<div class="warnbox">Faltam partes: ${missing.map(i=>i+"/"+total).join(", ")}. Escaneie a(s) parte(s) que falta(m) — sem todas, o BU não é calculado.</div>`));
    return;
  }
  const {cab,cargos}=parseToks(toks);
  const turno={"1":"1º turno","2":"2º turno"}[cab.TURN]||cab.TURN||"";
  let html=`<div class="result"><div class="r-head">
    <h2>Boletim lido — ${present.length} de ${total} QR</h2>
    <div class="meta">
      <span>Município <b>${cab.MUNI||"?"}</b></span><span>Zona <b>${cab.ZONA||"?"}</b></span>
      <span>Seção <b>${cab.SECA||"?"}</b></span><span>${turno} · ${cab.DTPL||""}</span>
      <span>Aptos <b>${cab.APTO||"?"}</b></span><span>Compareceram <b>${cab.COMP||"?"}</b></span>
    </div></div>`;

  for(const c of cargos){
    const nome=CARGOS[c.CARG]||("Cargo "+c.CARG);
    const prop=c.tipo==="1";
    const t=c.tot;
    html+=`<div class="cargo"><h3>${nome}<span class="tipo">${prop?"proporcional":"majoritário"}</span></h3>`;
    if(prop){
      const parts=[...c.partidos].sort((a,b)=>b.TOTP-a.TOTP);
      let sNom=0,sLeg=0;
      for(const p of parts){const nom=sum(p.votos);sNom+=nom;sLeg+=p.LEGP;
        html+=`<div class="row"><span class="n">Partido ${p.PART} <span style="opacity:.7">(nom ${nom} · leg ${p.LEGP})</span></span><span>${p.TOTP}</span></div>`;}
      const cand=[];for(const p of parts)for(const [num,v] of Object.entries(p.votos))cand.push([num,v,p.PART]);
      cand.sort((a,b)=>b[1]-a[1]);
      html+=`<div class="rule"></div><div class="row"><span class="n">Mais votado</span><span>${cand[0]?cand[0][0]+" · "+cand[0][1]+" votos":"—"}</span></div>`;
      html+=`<div class="row"><span class="n">Brancos</span><span>${t.BRAN}</span></div><div class="row"><span class="n">Nulos</span><span>${t.NULO}</span></div>`;
      html+=`<div class="row b"><span>Total</span><span>${t.TOTC}</span></div>`;
      const ok=(sNom===+t.NOMI)&&(sLeg===+t.LEGC)&&((+t.NOMI)+(+t.LEGC)+(+t.BRAN)+(+t.NULO)===+t.TOTC);
      html+=badge(ok);
    }else{
      const flat=Object.entries(c.flat).sort((a,b)=>b[1]-a[1]);
      let s=0;for(const [num,v] of flat){s+=v;html+=`<div class="row"><span class="n">Candidato ${num}</span><span>${v}</span></div>`;}
      html+=`<div class="rule"></div><div class="row"><span class="n">Brancos</span><span>${t.BRAN}</span></div><div class="row"><span class="n">Nulos</span><span>${t.NULO}</span></div>`;
      html+=`<div class="row b"><span>Total</span><span>${t.TOTC}</span></div>`;
      const ok=(s===+t.NOMI)&&((+t.NOMI)+(+t.BRAN)+(+t.NULO)===+t.TOTC);
      html+=badge(ok);
    }
    html+=`</div>`;
  }
  html+=`<div class="assi"><div class="lbl">Assinatura do QR — confira com a impressa no papel</div><div class="val">${assi||"(ausente)"}</div></div></div>`;
  area.innerHTML='';area.appendChild(el(html));
  area.scrollIntoView({behavior:'smooth',block:'start'});
}
function badge(ok){return ok
  ? `<div class="badge ok">✓ Contas conferem</div>`
  : `<div class="badge bad">Conferência não fechou — revisar leitura</div>`;}

/* ---------- Câmera + leitura ao vivo ---------- */
const video=document.getElementById('video'), canvas=document.getElementById('canvas'), ctx=canvas.getContext('2d',{willReadFrequently:true});
const stage=document.getElementById('stage'), idle=document.getElementById('idle'), hint=document.getElementById('hint');
const partsEl=document.getElementById('parts'), statusEl=document.getElementById('status');
const btnStart=document.getElementById('btnStart');
let stream=null, scanning=false, detector=null, native=false;
let parts=new Map(), total=null, done=false;

function setStatus(s){statusEl.textContent=s||'';}
function flash(){stage.classList.add('hit');setTimeout(()=>stage.classList.remove('hit'),140);
  if(navigator.vibrate)navigator.vibrate(60);}

function renderParts(){
  if(total===null){partsEl.classList.add('hidden');return;}
  partsEl.classList.remove('hidden');partsEl.innerHTML='';
  for(let i=1;i<=total;i++){
    const ok=parts.has(i);
    partsEl.appendChild(el(`<span class="chip ${ok?'done':''}"><span class="dot"></span>Parte ${i}/${total}${ok?' ✓':''}</span>`));
  }
}

function handleText(text){
  if(done||!text||!text.startsWith("QRBU:"))return;
  const info=partInfo(text);if(!info)return;
  if(total===null){total=info.m;}
  if(info.m!==total){ // novo BU diferente -> reinicia
    parts=new Map();total=info.m;
  }
  if(parts.has(info.n))return; // já temos essa parte
  parts.set(info.n,text.trim());
  flash();renderParts();
  const faltam=total-parts.size;
  setStatus(faltam>0?`Parte ${info.n} lida. Faltam ${faltam}.`:`Todas as ${total} partes lidas.`);
  if(parts.size>=total){finish();}
}

function finish(){
  done=true;scanning=false;stopCamera();
  hint.classList.add('hidden');setStatus('Boletim completo ✓');
  btnStart.textContent='Escanear outro BU';btnStart.disabled=false;
  renderResult(parts);
}

async function scanLoop(){
  if(!scanning)return;
  try{
    if(native){
      const codes=await detector.detect(video);
      for(const c of codes)handleText(c.rawValue);
    }else if(window.jsQR){
      const w=video.videoWidth,h=video.videoHeight;
      if(w&&h){canvas.width=w;canvas.height=h;ctx.drawImage(video,0,0,w,h);
        const d=ctx.getImageData(0,0,w,h);
        const r=jsQR(d.data,w,h,{inversionAttempts:"attemptBoth"});
        if(r)handleText(r.data);}
    }
  }catch(e){}
  if(scanning)requestAnimationFrame(scanLoop);
}

async function startCamera(){
  if(done){ // reset para novo BU
    done=false;parts=new Map();total=null;
    document.getElementById('resultArea').innerHTML='';renderParts();
  }
  setStatus('Abrindo câmera…');btnStart.disabled=true;
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:"environment"}},audio:false});
  }catch(e){
    setStatus('');btnStart.disabled=false;
    document.getElementById('resultArea').innerHTML='';
    document.getElementById('resultArea').appendChild(el(`<div class="warnbox">Não consegui abrir a câmera (${e.name}). Confira a permissão do navegador — ou use <b>Enviar foto</b>, que funciona do mesmo jeito.</div>`));
    return;
  }
  video.srcObject=stream;await video.play();
  idle.classList.add('hidden');hint.classList.remove('hidden');
  if('BarcodeDetector' in window){
    try{const f=await BarcodeDetector.getSupportedFormats();
      if(f.includes('qr_code')){detector=new BarcodeDetector({formats:['qr_code']});native=true;}
    }catch(e){}
  }
  setStatus(native?'Câmera ativa — leitor nativo':'Câmera ativa — leitor em JS');
  btnStart.textContent='Escaneando…';
  scanning=true;scanLoop();
}
function stopCamera(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}}

btnStart.addEventListener('click',startCamera);

/* Plano B: foto(s) — aceita várias de uma vez */
async function decodeImage(file){
  const bmp=await createImageBitmap(file);
  if('BarcodeDetector' in window){
    try{const f2=await BarcodeDetector.getSupportedFormats();
      if(f2.includes('qr_code')){const det=new BarcodeDetector({formats:['qr_code']});
        const codes=await det.detect(bmp);const q=codes.find(c=>c.rawValue.startsWith("QRBU:"));if(q)return q.rawValue;}
    }catch(e){}
  }
  if(window.jsQR){
    for(const scale of [1,0.6,1.5,0.45,0.8]){
      const w=Math.round(bmp.width*scale),h=Math.round(bmp.height*scale);
      canvas.width=w;canvas.height=h;ctx.drawImage(bmp,0,0,w,h);
      const d=ctx.getImageData(0,0,w,h);
      const r=jsQR(d.data,w,h,{inversionAttempts:"attemptBoth"});
      if(r&&r.data.startsWith("QRBU:"))return r.data;
    }
  }
  return null;
}
document.getElementById('file').addEventListener('change',async e=>{
  const files=[...e.target.files];if(!files.length)return;
  if(done){done=false;parts=new Map();total=null;document.getElementById('resultArea').innerHTML='';renderParts();}
  let lidas=0,falhas=0;
  for(const f of files){
    setStatus(`Lendo foto ${lidas+falhas+1} de ${files.length}…`);
    const text=await decodeImage(f);
    if(text){handleText(text);lidas++;} else {falhas++;}
  }
  e.target.value='';
  if(!done){
    setStatus(`${lidas} QR lido(s)${falhas?`, ${falhas} não deu`:''}. ${total?`Faltam ${total-parts.size} parte(s).`:'Nenhum QR de BU reconhecido.'}`);
  }
});
</script>
</body>
</html>
