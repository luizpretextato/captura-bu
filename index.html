<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<title>Captura de BU — apuração paralela</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<style>
  :root{
    --bg:#0E1116; --surface:#171B22; --surface2:#1E242E;
    --ink:#E7ECF3; --muted:#8A94A6; --line:#262C36;
    --ok:#3DD68C; --warn:#F2B84B; --bad:#F2685B; --accent:#5B8DEF;
    --shadow:0 8px 30px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--ink);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased; line-height:1.45;
    display:flex; flex-direction:column; min-height:100dvh;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  code,.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
  header{padding:14px 18px 6px}
  header h1{font-size:15px; font-weight:600; letter-spacing:.2px; margin:0}
  header p{font-size:12.5px; color:var(--muted); margin:2px 0 0}
  main{flex:1; display:flex; flex-direction:column; gap:14px; padding:8px 16px 20px; max-width:640px; width:100%; margin:0 auto}

  .stage{position:relative; width:100%; aspect-ratio:1/1; border-radius:18px; overflow:hidden;
    background:#000; border:1px solid var(--line); box-shadow:var(--shadow)}
  #reader{position:absolute; inset:0}
  #reader video{width:100%!important; height:100%!important; object-fit:cover!important}
  #reader img[alt="Info icon"]{display:none}
  .stage-idle{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:14px; text-align:center; padding:24px; color:var(--muted); pointer-events:none}
  .stage-idle svg{opacity:.7}
  .livehint{position:absolute; left:12px; right:12px; bottom:12px; z-index:5; text-align:center;
    background:rgba(10,14,20,.72); backdrop-filter:blur(4px); border:1px solid rgba(255,255,255,.14);
    border-radius:12px; padding:11px 14px; font-size:14px; font-weight:600; color:#EAF0FA}
  .livehint.step{background:rgba(61,214,140,.22); border-color:rgba(61,214,140,.5); color:#DFF7EA}
  .livehint small{display:block; font-weight:500; font-size:12px; color:#AEB8C7; margin-top:2px}

  .cam-ctrl{display:flex; gap:10px; align-items:center; justify-content:center}
  .cam-ctrl .zoom{flex:1; display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--line);
    border-radius:12px; padding:8px 12px; font-size:13px; color:var(--muted)}
  .cam-ctrl .zoom input{flex:1; accent-color:var(--accent)}
  .cam-ctrl .torch{flex:0 0 auto; width:auto; padding:10px 14px; font-size:13px}
  .cam-ctrl .torch.on{background:var(--warn); border-color:var(--warn); color:#1A1400}
  .parts{display:flex; gap:8px; align-items:center; justify-content:center; min-height:34px; flex-wrap:wrap}
  .chip{display:inline-flex; align-items:center; gap:7px; padding:6px 12px; border-radius:999px;
    background:var(--surface); border:1px solid var(--line); font-size:13px; color:var(--muted)}
  .chip.done{border-color:var(--ok); color:var(--ink)}
  .chip .dot{width:8px;height:8px;border-radius:50%;background:var(--line)}
  .chip.done .dot{background:var(--ok)}
  .status{font-size:13.5px; color:var(--muted); text-align:center; min-height:18px}

  .actions{display:flex; gap:10px}
  button{font:inherit; font-weight:600; border:0; border-radius:12px; padding:14px 16px; cursor:pointer;
    flex:1; color:var(--ink); background:var(--surface2); border:1px solid var(--line)}
  button.primary{background:var(--accent); border-color:var(--accent); color:#0A0E14}
  button:active{transform:translateY(1px)}
  button:disabled{opacity:.5}
  .filebtn{position:relative; overflow:hidden}
  .filebtn input{position:absolute; inset:0; opacity:0; cursor:pointer}

  .result{background:var(--surface); border:1px solid var(--line); border-radius:16px; overflow:hidden}
  .r-head{padding:16px 18px; border-bottom:1px solid var(--line)}
  .r-head h2{margin:0; font-size:16px}
  .r-head .meta{margin-top:6px; font-size:13px; color:var(--muted); display:grid; grid-template-columns:1fr 1fr; gap:2px 14px}
  .cargo{padding:14px 18px; border-bottom:1px solid var(--line)}
  .cargo:last-child{border-bottom:0}
  .cargo h3{margin:0 0 2px; font-size:14px; display:flex; align-items:center; justify-content:space-between}
  .tipo{font-size:11px; font-weight:600; color:var(--muted); background:var(--surface2); padding:3px 9px; border-radius:999px}
  .row{display:flex; justify-content:space-between; font-size:13.5px; padding:3px 0}
  .row .n{color:var(--muted)}
  .row.b{font-weight:700}
  .rule{height:1px; background:var(--line); margin:8px 0}
  .badge{display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600; padding:5px 10px; border-radius:999px; margin-top:8px}
  .badge.ok{color:var(--ok); background:rgba(61,214,140,.12)}
  .badge.bad{color:var(--bad); background:rgba(242,104,91,.12)}
  .success{display:flex; align-items:center; gap:12px; background:rgba(61,214,140,.14); border:1px solid rgba(61,214,140,.45);
    color:#B6F0D2; border-radius:14px; padding:14px 16px; margin-bottom:14px; animation:pop .28s ease-out}
  .success .ico{flex:0 0 auto; width:34px; height:34px; border-radius:50%; background:var(--ok); color:#08130C;
    display:flex; align-items:center; justify-content:center; font-size:20px; font-weight:700}
  .success .txt strong{display:block; font-size:15px; color:#E7ECF3}
  .success .txt span{font-size:12.5px; color:#8FD9B4}
  @keyframes pop{from{transform:scale(.96); opacity:0} to{transform:scale(1); opacity:1}}
  .assi{padding:14px 18px}
  .assi .lbl{font-size:12px; color:var(--muted); margin-bottom:6px}
  .assi .val{font-family:'JetBrains Mono',monospace; font-size:11px; word-break:break-all; color:var(--ink); line-height:1.5}
  .warnbox{background:rgba(242,184,75,.1); border:1px solid rgba(242,184,75,.35); color:#F6D28A;
    border-radius:12px; padding:12px 14px; font-size:13px}
  .hidden{display:none!important}
  footer{padding:10px 18px 18px; text-align:center; font-size:11.5px; color:var(--muted)}
</style>
</head>
<body>
<header>
  <h1>Captura de Boletim de Urna</h1>
  <p>Apuração paralela · leitura ao vivo do QR</p>
</header>

<main>
  <div class="stage">
    <div id="reader"></div>
    <div class="livehint hidden" id="livehint"></div>
    <div class="stage-idle" id="idle">
      <svg width="46" height="46" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
        <path d="M3 9V6a3 3 0 0 1 3-3h3M21 9V6a3 3 0 0 0-3-3h-3M3 15v3a3 3 0 0 0 3 3h3M21 15v3a3 3 0 0 1-3 3h-3"/>
        <rect x="8" y="8" width="8" height="8" rx="1"/>
      </svg>
      <div>Toque em <b>Iniciar câmera</b> e aponte para o QR do boletim.</div>
    </div>
  </div>

  <div class="cam-ctrl hidden" id="camCtrl">
    <label class="zoom hidden" id="zoomWrap">Zoom
      <input type="range" id="zoom" min="1" max="5" step="0.1" value="1">
    </label>
    <button type="button" class="torch hidden" id="torch">Lanterna</button>
  </div>
  <div class="parts hidden" id="parts"></div>
  <div class="status" id="status"></div>

  <div class="actions">
    <button class="primary" id="btnStart">Iniciar câmera</button>
    <button class="filebtn" id="btnFile">Enviar foto(s)
      <input type="file" accept="image/*" id="file" multiple>
    </button>
  </div>

  <div id="resultArea"></div>
</main>

<footer>Números de candidato e partido conforme o QR. Resultado não-oficial — apuração paralela.<br>versão 8 — com nomes (amostra Santo André 2024)</footer>

<script>
/* ---------- Interpretação do BU (portado do parse_bu.py, validado) ---------- */
const HEADER_KEYS=new Set(["ORIG","ORLC","PROC","DTPL","PLEI","TURN","FASE","UNFE","MUNI","ZONA","SECA","IDUE","IDCA","HIQT","HICA","VERS","LOCA","APTO","APTS","APTT","COMP","FALT","HBBM","HBBG","HBSB","HBMA","DTAB","HRAB","DTFC","HRFC","IDEL"]);
const TOTAIS=new Set(["APTA","APTS","APTT","NOMI","LEGC","BRAN","NULO","TOTC"]);
const CARGOS={"1":"Presidente","3":"Governador","5":"Senador","6":"Deputado Federal","7":"Deputado Estadual","8":"Deputado Distrital","11":"Prefeito","12":"Vice-Prefeito","13":"Vereador"};

/* ---- Cadastro de candidatos (protótipo: Santo André/SP, muni 70572, 2024) ----
   No app real, esta base vem do arquivo completo de candidatos do TSE por município.
   Aqui está uma amostra para o teste. */
const PARTIDOS={"10":"REPUBLICANOS","11":"PP","12":"PDT","13":"PT","15":"MDB","20":"PODEMOS","22":"PL","23":"CIDADANIA","25":"PRD","27":"DC","29":"PCO","30":"NOVO","35":"PMB","40":"PSB","43":"PV","44":"UNIÃO","45":"PSDB","50":"PSOL","55":"PSD","65":"PCdoB","70":"AVANTE","77":"SOLIDARIEDADE"};
const CANDIDATOS={
  "11":{"13":"Bete Siraque","22":"Luiz Zacarias","29":"Clenilza","30":"Coronel Sardano","40":"Eduardo Leite","45":"Gilvan"},
  "13":{"10000":"Alberto Gama","20000":"Ageu Padoveze","30130":"Anderson Damasceno","40112":"Andrea Silva","40789":"André Duarte","43000":"Andrea do Sapeca","50456":"Andreia do MTST","70789":"Nino Brandão"}
};
function nomeCand(cargo,numero){return (CANDIDATOS[cargo]||{})[numero]||null;}
function siglaPart(numPartido){return PARTIDOS[numPartido]||("nº "+numPartido);}
function siglaPorCand(numero){return PARTIDOS[String(numero).slice(0,2)]||"";}
function partInfo(t){const m=t.match(/^QRBU:(\d+):(\d+)/);return m?{n:+m[1],m:+m[2]}:null;}
function reassemble(map){
  const ns=[...map.keys()].sort((a,b)=>a-b);
  const total=partInfo(map.get(ns[0])).m;
  const missing=[];for(let i=1;i<=total;i++)if(!map.has(i))missing.push(i);
  let toks=[],assi=null;
  for(const n of ns){
    const ts=map.get(n).trim().split(/\s+/);
    for(const t of ts)if(t.startsWith("ASSI:"))assi=t.slice(5);
    toks=toks.concat(ts.filter(t=>!/^(QRBU|VRQR|VRCH|HASH|ASSI):/.test(t)));
  }
  return {toks,total,present:ns,missing,assi};
}
function parseToks(toks){
  const cab={},cargos=[];let cargo=null,part=null;
  for(const t of toks){
    const i=t.indexOf(":");if(i<0)continue;
    const ch=t.slice(0,i),val=t.slice(i+1);
    if(ch==="CARG"){cargo={CARG:val,tipo:null,partidos:[],flat:{},tot:{}};cargos.push(cargo);part=null;}
    else if(ch==="TIPO"&&cargo)cargo.tipo=val;
    else if(ch==="PART"&&cargo){part={PART:val,votos:{},LEGP:0,TOTP:0};cargo.partidos.push(part);}
    else if(ch==="LEGP"&&part)part.LEGP=+val;
    else if(ch==="TOTP"&&part)part.TOTP=+val;
    else if(TOTAIS.has(ch)&&cargo&&cargo.tipo!==null){cargo.tot[ch]=+val;part=null;}
    else if(/^\d+$/.test(ch)&&cargo){if(part)part.votos[ch]=+val;else cargo.flat[ch]=+val;}
    else if(HEADER_KEYS.has(ch)&&!cargo)cab[ch]=val;
  }
  return {cab,cargos};
}
function el(h){const d=document.createElement('div');d.innerHTML=h;return d.firstElementChild;}
function sum(o){return Object.values(o).reduce((a,b)=>a+b,0);}
function badge(ok){return ok?`<div class="badge ok">✓ Contas conferem</div>`:`<div class="badge bad">Conferência não fechou — revisar leitura</div>`;}
function renderResult(map){
  const {toks,total,present,missing,assi}=reassemble(map);
  const area=document.getElementById('resultArea');
  if(missing.length){area.innerHTML='';area.appendChild(el(`<div class="warnbox">Faltam partes: ${missing.map(i=>i+"/"+total).join(", ")}. Escaneie a(s) parte(s) que falta(m).</div>`));return;}
  const {cab,cargos}=parseToks(toks);
  const turno={"1":"1º turno","2":"2º turno"}[cab.TURN]||cab.TURN||"";
  let html=`<div class="success"><div class="ico">✓</div><div class="txt"><strong>Boletim lido com sucesso</strong><span>Seção ${cab.SECA||"?"} · Zona ${cab.ZONA||"?"} · ${present.length} de ${total} QR</span></div></div>`;
  html+=`<div class="result"><div class="r-head"><h2>Resultado da seção</h2>
    <div class="meta"><span>Município <b>${cab.MUNI||"?"}</b></span><span>Zona <b>${cab.ZONA||"?"}</b></span>
    <span>Seção <b>${cab.SECA||"?"}</b></span><span>${turno} · ${cab.DTPL||""}</span>
    <span>Aptos <b>${cab.APTO||"?"}</b></span><span>Compareceram <b>${cab.COMP||"?"}</b></span></div></div>`;
  for(const c of cargos){
    const nome=CARGOS[c.CARG]||("Cargo "+c.CARG),prop=c.tipo==="1",t=c.tot;
    html+=`<div class="cargo"><h3>${nome}<span class="tipo">${prop?"proporcional":"majoritário"}</span></h3>`;
    if(prop){
      const parts=[...c.partidos].sort((a,b)=>b.TOTP-a.TOTP);let sNom=0,sLeg=0;
      for(const p of parts){const nom=sum(p.votos);sNom+=nom;sLeg+=p.LEGP;
        html+=`<div class="row"><span class="n">${siglaPart(p.PART)} <span style="opacity:.6">nº ${p.PART} · nom ${nom} leg ${p.LEGP}</span></span><span>${p.TOTP}</span></div>`;}
      const cand=[];for(const p of parts)for(const [num,v] of Object.entries(p.votos))cand.push([num,v]);
      cand.sort((a,b)=>b[1]-a[1]);
      let topLabel="—";
      if(cand[0]){const nm=nomeCand(c.CARG,cand[0][0]),sg=siglaPorCand(cand[0][0]);
        topLabel=(nm?nm+" ":"")+cand[0][0]+(sg?" · "+sg:"")+" · "+cand[0][1]+" votos";}
      html+=`<div class="rule"></div><div class="row"><span class="n">Mais votado</span><span style="text-align:right">${topLabel}</span></div>`;
      html+=`<div class="row"><span class="n">Brancos</span><span>${t.BRAN}</span></div><div class="row"><span class="n">Nulos</span><span>${t.NULO}</span></div><div class="row b"><span>Total</span><span>${t.TOTC}</span></div>`;
      html+=badge((sNom===+t.NOMI)&&(sLeg===+t.LEGC)&&((+t.NOMI)+(+t.LEGC)+(+t.BRAN)+(+t.NULO)===+t.TOTC));
    }else{
      const flat=Object.entries(c.flat).sort((a,b)=>b[1]-a[1]);let s=0;
      for(const [num,v] of flat){s+=v;
        const nm=nomeCand(c.CARG,num),sg=siglaPorCand(num);
        const label=nm?`${nm} <span style="opacity:.6">${num}${sg?" · "+sg:""}</span>`:`Candidato ${num}${sg?" · "+sg:""}`;
        html+=`<div class="row"><span class="n">${label}</span><span>${v}</span></div>`;}
      html+=`<div class="rule"></div><div class="row"><span class="n">Brancos</span><span>${t.BRAN}</span></div><div class="row"><span class="n">Nulos</span><span>${t.NULO}</span></div><div class="row b"><span>Total</span><span>${t.TOTC}</span></div>`;
      html+=badge((s===+t.NOMI)&&((+t.NOMI)+(+t.BRAN)+(+t.NULO)===+t.TOTC));
    }
    html+=`</div>`;
  }
  html+=`<div class="assi"><div class="lbl">Assinatura do QR — confira com a impressa no papel</div><div class="val">${assi||"(ausente)"}</div></div></div>`;
  area.innerHTML=html;area.scrollIntoView({behavior:'smooth',block:'start'});
}

/* ---------- Câmera + leitura (html5-qrcode: leitor forte) ---------- */
const idle=document.getElementById('idle'), partsEl=document.getElementById('parts'), statusEl=document.getElementById('status'), btnStart=document.getElementById('btnStart');
let qr=null, running=false, parts=new Map(), total=null, done=false;
const livehint=document.getElementById('livehint');
function setStatus(s){statusEl.textContent=s||'';}
function nextMissing(){if(total===null)return null;for(let i=1;i<=total;i++)if(!parts.has(i))return i;return null;}
function updateLiveHint(justRead){
  if(done||!running){livehint.classList.add('hidden');return;}
  livehint.classList.remove('hidden');
  if(total===null||total===1){
    livehint.className='livehint';livehint.innerHTML='Aponte para o QR do boletim';return;
  }
  const nx=nextMissing();
  if(nx===null){livehint.classList.add('hidden');return;}
  if(justRead){
    livehint.className='livehint step';
    livehint.innerHTML=`✓ Parte ${justRead} de ${total} lida<small>Agora aponte para a parte ${nx} de ${total}</small>`;
  }else{
    livehint.className='livehint';
    livehint.innerHTML=`Aponte para a parte ${nx} de ${total}<small>${parts.size} de ${total} já lidas</small>`;
  }
}
function renderParts(){
  if(total===null){partsEl.classList.add('hidden');return;}
  partsEl.classList.remove('hidden');partsEl.innerHTML='';
  for(let i=1;i<=total;i++){const ok=parts.has(i);
    partsEl.appendChild(el(`<span class="chip ${ok?'done':''}"><span class="dot"></span>Parte ${i}/${total}${ok?' ✓':''}</span>`));}
}
function handleText(text){
  if(done||!text||!text.startsWith("QRBU:"))return false;
  const info=partInfo(text);if(!info)return false;
  if(total===null)total=info.m;
  if(info.m!==total){parts=new Map();total=info.m;}
  if(parts.has(info.n))return true;
  parts.set(info.n,text.trim());
  if(navigator.vibrate)navigator.vibrate(60);
  renderParts();
  const faltam=total-parts.size;
  setStatus(faltam>0?`Parte ${info.n} lida. Faltam ${faltam}.`:`Todas as ${total} partes lidas.`);
  if(parts.size>=total){finish();}
  else{updateLiveHint(info.n);}
  return true;
}
async function finish(){
  done=true;
  if(qr&&running){try{await qr.stop();}catch(e){}running=false;}
  livehint.classList.add('hidden');hideCameraControls();
  setStatus('Boletim completo ✓');btnStart.textContent='Escanear outro BU';btnStart.disabled=false;
  renderResult(parts);
}
function resetState(){done=false;parts=new Map();total=null;document.getElementById('resultArea').innerHTML='';renderParts();}
async function startCamera(){
  if(done)resetState();
  if(running){return;}
  setStatus('Abrindo câmera…');btnStart.disabled=true;idle.classList.add('hidden');
  if(!qr)qr=new Html5Qrcode("reader",{formatsToSupport:[Html5QrcodeSupportedFormats.QR_CODE],verbose:false});
  const config={fps:10, qrbox:undefined, aspectRatio:1.0,
    experimentalFeatures:{useBarCodeDetectorIfSupported:true},
    videoConstraints:{facingMode:"environment", width:{ideal:1920}, height:{ideal:1080}}};
  try{
    await qr.start({facingMode:"environment"}, config,
      (decoded)=>handleText(decoded),
      ()=>{});
    running=true;setStatus('Câmera ativa — aponte para o QR');btnStart.textContent='Escaneando…';updateLiveHint();
    setupCameraControls();
  }catch(e){
    running=false;btnStart.disabled=false;idle.classList.remove('hidden');
    document.getElementById('resultArea').innerHTML='';
    document.getElementById('resultArea').appendChild(el(`<div class="warnbox">Não consegui abrir a câmera (${e&&e.name?e.name:e}). Verifique se abriu no navegador de verdade (não dentro de outro app) e a permissão de câmera — ou use <b>Enviar foto(s)</b>.</div>`));
  }
}
btnStart.addEventListener('click',startCamera);

/* Controles de câmera: zoom óptico e lanterna (quando o aparelho suporta) */
const camCtrl=document.getElementById('camCtrl'), zoomWrap=document.getElementById('zoomWrap'),
      zoomInput=document.getElementById('zoom'), torchBtn=document.getElementById('torch');
let torchOn=false;
function setupCameraControls(){
  let caps={};
  try{caps=qr.getRunningTrackCapabilities()||{};}catch(e){caps={};}
  let any=false;
  if(caps.zoom&&typeof caps.zoom.max==='number'&&caps.zoom.max>caps.zoom.min){
    zoomInput.min=caps.zoom.min; zoomInput.max=caps.zoom.max;
    zoomInput.step=caps.zoom.step||0.1; zoomInput.value=caps.zoom.min;
    zoomWrap.classList.remove('hidden'); any=true;
  }else zoomWrap.classList.add('hidden');
  if(caps.torch){torchBtn.classList.remove('hidden'); any=true;}
  else torchBtn.classList.add('hidden');
  camCtrl.classList.toggle('hidden',!any);
}
function hideCameraControls(){camCtrl.classList.add('hidden');torchOn=false;torchBtn.classList.remove('on');}
zoomInput.addEventListener('input',()=>{
  try{qr.applyVideoConstraints({advanced:[{zoom:parseFloat(zoomInput.value)}]});}catch(e){}
});
torchBtn.addEventListener('click',()=>{
  torchOn=!torchOn;
  try{qr.applyVideoConstraints({advanced:[{torch:torchOn}]});torchBtn.classList.toggle('on',torchOn);}
  catch(e){torchOn=!torchOn;}
});

/* Foto(s) — leitor forte via scanFile */
document.getElementById('file').addEventListener('change',async e=>{
  const files=[...e.target.files];if(!files.length)return;
  if(done)resetState();
  if(!qr)qr=new Html5Qrcode("reader",{formatsToSupport:[Html5QrcodeSupportedFormats.QR_CODE],verbose:false});
  if(running){try{await qr.stop();}catch(_){}running=false;btnStart.disabled=false;btnStart.textContent='Iniciar câmera';idle.classList.remove('hidden');hideCameraControls();}
  let lidas=0,falhas=0;
  for(const f of files){
    setStatus(`Lendo foto ${lidas+falhas+1} de ${files.length}…`);
    try{const decoded=await qr.scanFile(f,false);
      if(handleText(decoded))lidas++;else falhas++;
    }catch(err){falhas++;}
  }
  e.target.value='';
  if(!done)setStatus(`${lidas} QR lido(s)${falhas?`, ${falhas} não deu`:''}. ${total?`Faltam ${total-parts.size} parte(s).`:'Nenhum QR de BU reconhecido nessas fotos.'}`);
});
</script>
</body>
</html>
